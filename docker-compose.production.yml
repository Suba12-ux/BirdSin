volumes:
  pg_data_production:
  static_volume:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: semomov/birdsin_backend:latest
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - static_volume:/backend_static
      - media:/app/media
    restart: always

  frontend:
    image: semomov/birdsin_frontend:latest
    env_file: .env
    volumes:
      - static_volume:/frontend_static
    command: cp -r /usr/share/nginx/html/. /frontend_static/
    restart: no

  gateway:
    image: semomov/birdsin_gateway:latest
    env_file: .env
    depends_on:
      - backend
    volumes:
      - static_volume:/usr/share/nginx/html/
      - media:/usr/share/nginx/html/media/
    ports:
      - 7000:80
    restart: always